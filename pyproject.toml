[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "siyuan-syc"
version = "0.1.0"
description = "CLI for agents to work with SiYuan note instances"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tttpob", email = "i@tpob.io" }]
readme = "README.md"
dependencies = ["click>=8", "httpx2", "mcp>=2.3,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
syc = "syc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["syc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
preset = "basic"
project-includes = ["syc/**/*.py", "tests/**/*.py"]
